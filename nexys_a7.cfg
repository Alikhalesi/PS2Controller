# nexys_a7.cfg

adapter driver ftdi
ftdi_vid_pid 0x0403 0x6010

# ADD THIS LINE: Tells libusb exactly what the physical hardware string is named
ftdi_device_desc "Digilent USB Device"

ftdi_channel 0
ftdi_layout_init 0x0088 0x008b

adapter speed 10000
transport select jtag

#xc7a100t
# Define the Artix-7 100T TAP
#jtag newtap xc7a100t tap -irlen 6 -ignore-version -expected-id 0x03631093

##### only needed for pragram the chip
source [find cpld/xilinx-xc7.cfg]
init
pld load 0 E:/FPGA/Projs/PS2Controller/PS2Controller/PS2Controller.runs/impl_1/top.bit
####
#init
#jtag newtap xc7a100t tap -irlen 6 -ignore-version -expected-id 0x03631093

# Reference the exact same name in irscan and drscan
irscan xc7.tap 0x02
set read_data [drscan xc7.tap 32 0x12345678]
echo "TDO readback: $read_data"
